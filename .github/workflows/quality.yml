name: root-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: root-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  briefing-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install root quality tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Compile the complete control plane
        run: python -m compileall -q atlas.py work/global-briefing/scripts
      - name: Run static analysis
        run: python -m ruff check atlas.py tests work/global-briefing/scripts work/global-briefing/tests
      - name: Run Python security analysis
        run: bandit -q -r atlas.py work/global-briefing/scripts -ll
      - name: Detect committed secrets
        shell: bash
        run: git ls-files -z | grep -zv '^skills-lock.json$' | xargs -0 detect-secrets-hook
      - name: Audit Python dependency manifests
        run: |
          pip-audit --strict -r requirements-dev.txt --progress-spinner off
          pip-audit --strict -r work/global-briefing/requirements.txt --progress-spinner off
      - name: Run all root-owned tests
        run: python -m pytest --cov=atlas --cov=work/global-briefing/scripts --cov-report=term-missing --cov-fail-under=60 -q
      - name: Verify package entry point
        run: |
          python -m pip install -e . --no-deps
          atlas --help
