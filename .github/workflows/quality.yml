name: root-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: root-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  briefing-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install root quality tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Compile the complete control plane
        run: python -m compileall -q atlas.py work/global-briefing/scripts
      - name: Run static analysis
        run: python -m ruff check atlas.py tests work/global-briefing/scripts work/global-briefing/tests
      - name: Run all root-owned tests
        run: python -m pytest -q
      - name: Verify package entry point
        run: |
          python -m pip install -e . --no-deps
          atlas --help
