[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research-workspace"
version = "0.1.0"
description = "Unified command surface for the global briefing, trading research core, and ATLAS site."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "defusedxml==0.7.1",
  "bandit==1.9.4",
  "detect-secrets==1.5.0",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.12",
]

[project.scripts]
atlas = "atlas:main"

[tool.setuptools]
py-modules = ["atlas"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "work/global-briefing/tests",
]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".venv",
  "node_modules",
  "src",
  "work/trading-core",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"work/global-briefing/scripts/briefing_store.py" = ["E402"]
"work/global-briefing/scripts/drift_diagnostics.py" = ["E402"]
"work/global-briefing/scripts/evolution.py" = ["E402"]
"work/global-briefing/scripts/paper_trading.py" = ["E402"]
"work/global-briefing/scripts/resolution_evidence.py" = ["E402"]
