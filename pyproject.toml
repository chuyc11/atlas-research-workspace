[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research-workspace"
version = "0.1.0"
description = "Unified command surface for the global briefing, trading research core, and ATLAS site."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
atlas = "atlas:main"

[tool.setuptools]
py-modules = ["atlas"]
